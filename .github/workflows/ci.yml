name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  # main is never cancelled mid run, so a version release that has been created
  # always gets its archives attached
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # recreate the rolling release (and, on a version bump, create the version
  # release) before either platform starts so both archives are attached to a
  # tag that points at this commit
  prepare-release:
    name: Prepare releases
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}

    steps:
      - name: Check out CMakeLists.txt
        uses: actions/checkout@v4
        with:
          sparse-checkout: CMakeLists.txt
          sparse-checkout-cone-mode: false

      # a push to main that carries a version nobody has released yet (the
      # "chore: bump version" commit) also publishes a v<version> release; a
      # re-run of that same commit attaches the archives again
      - name: Detect a version bump
        id: version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n 's/^set(HLTOOLS_VERSION "\([0-9][0-9.]*\)")$/\1/p' CMakeLists.txt)
          if [ -z "$version" ]; then
            echo "HLTOOLS_VERSION was not found in CMakeLists.txt" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          tag="v$version"
          tagged=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null || true)
          if [ -z "$tagged" ]; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "hltools $version" \
              --generate-notes \
              --latest
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$tagged" = "$GITHUB_SHA" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Move the nightly tag to this commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            --target "$GITHUB_SHA" \
            --title "Nightly build ${GITHUB_SHA:0:7}" \
            --notes "Automatic build of main at ${GITHUB_SHA}. Windows and Linux archives are attached by the platform build jobs." \
            --prerelease

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: prepare-release

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            generator: Unix Makefiles
            shader_platform: linux-x86_64
            shader_compiler: glslc
            unified_archive: hltools-linux-x64.tar.gz
          - name: windows
            os: windows-2022
            generator: Visual Studio 17 2022
            shader_platform: windows-x86_64
            shader_compiler: glslc.exe
            unified_archive: hltools-windows-x64.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          $glslc = Join-Path $env:ANDROID_NDK_LATEST_HOME "shader-tools/${{ matrix.shader_platform }}/${{ matrix.shader_compiler }}"
          if (!(Test-Path -LiteralPath $glslc)) {
              throw "glslc was not found at $glslc"
          }

          cmake `
              -S . `
              -B build `
              -G "${{ matrix.generator }}" `
              -DBUILD_TESTING=ON `
              -DHLTOOLS_GPU=ON `
              "-DGLSLC_EXECUTABLE=$glslc" `
              -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package/unified
          cp bin/hltools package/unified/
          cp README.md LICENSE THIRD_PARTY_NOTICES.md package/unified/
          tar -czf "${{ matrix.unified_archive }}" -C package/unified .

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package/unified | Out-Null
          Copy-Item bin/hltools.exe package/unified/
          Copy-Item README.md package/unified/
          Copy-Item LICENSE package/unified/
          Copy-Item THIRD_PARTY_NOTICES.md package/unified/
          Compress-Archive -Path package/unified/* -DestinationPath "${{ matrix.unified_archive }}"

      - name: Upload unified archive
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          path: ${{ matrix.unified_archive }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Attach archive to nightly release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload nightly "${{ matrix.unified_archive }}" --clobber

      - name: Attach archive to version release
        if: needs.prepare-release.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "v${{ needs.prepare-release.outputs.version }}" "${{ matrix.unified_archive }}" --clobber
